# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
# Only the domain module may use APIs below this level; app code needs 24.
kotlin.mpp.androidSourceSetLayoutVersion=2

# AndroidX is required by AGP 9 and Jetpack Compose.
android.useAndroidX=true
# Generate only the R classes the module actually references.
android.nonTransitiveRClass=true
# AGP 9 targets 17 by default; stated here so a future JDK bump cannot move it.
android.compileOptions.targetCompatibility=17